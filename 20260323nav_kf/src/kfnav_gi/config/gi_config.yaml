imu_freq    : 200
nav_pub_rate: 10
precisionEchoEpoch: 10 # 每间隔多少个GNSS观测频率打印一次状态信息
ca_timelength  : 20  # 初始对准时间
gnss_timelength: 10000 # 除去初始对准时间，正式开始解算时的GNSS观测时长
calc_timelength: 100000

is_gnss_using: true

is_baro_using: false
is_baro_using_kf: true
is_range_using: false
is_mag_yaw_using: true
range_id_1_3: [1,2,3]
range_id_4_6: [4,5,6]
range_id_7_9: [7,8,9]
range_id_10_12: [10,11,12]
anchor_id_1_3: [43,45,103]
# 1112,1122: 1580-1800
# 1217: 2650-2870

zupt_timelength: 80 # 零速观测时长，0表示禁用零速观测
omega_threshold: 1 # [deg/s]
velstd: [0.2,0.2,0.2] #[m/s]
baro_std: 5 #[m]
range_std: [65,200,-1] # 分别表示测距传感器误差（用于设置滤波权重）、测距传感器最大误差阈值（超过则不使用该时刻的测距信息）,最后一位-1无意义
gnss_pos_std: [0.5,0.5,1] #[m]

topic:
  imu: "/zh_origin"
  mag: "/mag_origin"
  gnss_origin: "/gnss_origin"
  gnss_pv: "unuse"
  baro: "baro"
  range: "/range"
  gi_nav: "gi_nav"

